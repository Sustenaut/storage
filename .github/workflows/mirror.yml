# Hourly: copies the files our installs pin into storage, so an install can
# fall back to storage when a download fails (mirror/). Storage takes this
# workflow's OpenID Connect token on main; GitHub's own token reads the
# public releases, and the mirror app's, when there is one, the locks.
# It stays off with the deploy, until STORAGE_DEPLOY is "on".
name: mirror

on:
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]
    paths: [mirror/**, .github/workflows/mirror.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  wheels:
    if: vars.STORAGE_DEPLOY == 'on' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Copy our releases' wheels
        run: mirror/wheels.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # The files the locks pin: Terraform's providers and PyPI's packages.
  # With the mirror app (MIRROR_APP_ID, MIRROR_APP_KEY), every lock its
  # installation reaches, private repositories' included; without it, the
  # public repositories' locks.
  locks:
    if: vars.STORAGE_DEPLOY == 'on' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Read-only (contents: read) on the repositories it is installed on.
      - name: Mint the mirror app's token
        id: app
        if: vars.MIRROR_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.MIRROR_APP_ID }}
          private-key: ${{ secrets.MIRROR_APP_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
      - name: Fetch the lock files
        run: mirror/locks.sh
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          MIRROR_APP: ${{ steps.app.outputs.token != '' && 'on' || '' }}
          LOCKS: ${{ runner.temp }}/locks
      - name: Copy the Terraform providers they pin
        run: mirror/terraform.sh
        env: { LOCKS: '${{ runner.temp }}/locks' }
      - name: Copy the PyPI files they pin
        run: mirror/pypi.sh
        env: { LOCKS: '${{ runner.temp }}/locks' }
