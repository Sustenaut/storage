# Written by `pubkit sync` from the ci block of pubkit.json. Do not edit:
# change pubkit.json and run `pubkit sync`.
name: pr

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  # Whether an earlier run already passed on this commit's tree: then the
  # jobs it ran are skipped, and nothing here tests less than it did.
  tested:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-tested.yml@3bf6ed20f0ae2fe63ffb08cba96fe59a6cfddcb1 # v0.35.0
    with: {"workflow": ".github/workflows/pr.yml"}
    permissions:
      actions: read
      contents: read

  checks:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubkit/.github/workflows/job-service-checks.yml@3bf6ed20f0ae2fe63ffb08cba96fe59a6cfddcb1 # v0.35.0
    with: {"shellcheck": "with-secrets mirror/*.sh scripts/*.sh"}

  tests:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubkit/.github/workflows/job-service-tests.yml@3bf6ed20f0ae2fe63ffb08cba96fe59a6cfddcb1 # v0.35.0
    with: {"setup": "npm ci", "test": "npm test"}

  sonar:
    name: ci
    needs: [tested, tests]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubkit/.github/workflows/job-sonar.yml@3bf6ed20f0ae2fe63ffb08cba96fe59a6cfddcb1 # v0.35.0
    with: {"reports": "sonar.python.coverage.reportPaths=*.xml sonar.javascript.lcov.reportPaths=lcov.info"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  # The site as deploy-static checks it before a deploy, so a site that
  # would fail to deploy fails the pull request. It deploys nothing.
  site:
    name: ci / site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: Sustenaut/pubhost/actions/deploy-static@2196c741d3de6c92c6035c42435c6e517c8ba0ce # v0.1.0
        with: {"dir": "public", "check-only": "true"}

  # The one check a ruleset requires: it passes only when every job
  # above succeeded or, where an earlier run already passed on the
  # commit's tree, was skipped for it. None is skipped for not being asked for.
  passed:
    name: ci / passed
    if: always()
    needs: [tested, checks, tests, sonar, site]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e --arg tested "$TESTED" '.tested.result == "success"
            and all(.[]; .result == "success" or (.result == "skipped" and $tested == "true"))' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}', TESTED: '${{ needs.tested.outputs.tested }}' }
