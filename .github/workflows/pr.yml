# Written by `pubkit sync` from the ci block of pubkit.json. Do not edit:
# change pubkit.json and run `pubkit sync`.
name: pr

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  checks:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-service-checks.yml@d634bd9ba97c6933561e9e7d1ceff5b975e8f22e # v0.28.0
    with: {"shellcheck": "with-secrets mirror/*.sh scripts/*.sh"}

  tests:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-service-tests.yml@d634bd9ba97c6933561e9e7d1ceff5b975e8f22e # v0.28.0
    with: {"setup": "npm ci", "test": "npm test"}

  sonar:
    name: ci
    needs: [tests]
    uses: Sustenaut/pubkit/.github/workflows/job-sonar.yml@18e9594780aeace92770d9bab1daf7ab1c8274d1 # v0.30.1
    with: {"reports": "sonar.python.coverage.reportPaths=*.xml sonar.javascript.lcov.reportPaths=lcov.info"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  # The site as deploy-static checks it before a deploy, so a site that
  # would fail to deploy fails the pull request. It deploys nothing.
  site:
    name: ci / site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: Sustenaut/pubkit/actions/deploy-static@d634bd9ba97c6933561e9e7d1ceff5b975e8f22e # v0.28.0
        with: {"dir": "public", "check-only": "true"}

  # The one check a ruleset requires: it passes only when every job
  # above succeeded. None of them is ever skipped for not being asked for.
  passed:
    name: ci / passed
    if: always()
    needs: [checks, tests, sonar, site]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}' }
