# Nightly: asks storage.sustenaut.eu to delete the photos no site uses any
# more (src/storage.js, clean). It needs no secret: the service runs a
# clean-up at most once a day, whoever asks. It stays off with the deploy,
# until STORAGE_DEPLOY is "on".
name: clean

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  clean:
    if: vars.STORAGE_DEPLOY == 'on'
    runs-on: ubuntu-latest
    steps:
      - name: Clean up
        run: |
          curl -fsS -X POST https://storage.sustenaut.eu/_clean | tee report.json
          echo
          jq -r 'to_entries[] | "\(.key): \(.value.deleted // [] | length) deleted\(if .value.skipped then ", skipped: \(.value.skipped)" else "" end)"' report.json
