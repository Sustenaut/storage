# Written by `pubkit sync` from the ci block of pubkit.json. Do not edit:
# change pubkit.json and run `pubkit sync`.
name: main

on:
  push: { branches: [main] }

permissions:
  contents: read

jobs:
  # Whether the merge queue already passed this commit: then the jobs
  # it ran are skipped, and nothing here tests less than the queue did.
  tested:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-tested.yml@d634bd9ba97c6933561e9e7d1ceff5b975e8f22e # v0.28.0
    with: {"workflow": ".github/workflows/pr.yml"}
    permissions:
      actions: read
      contents: read

  checks:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubkit/.github/workflows/job-service-checks.yml@d634bd9ba97c6933561e9e7d1ceff5b975e8f22e # v0.28.0
    with: {"shellcheck": "with-secrets mirror/*.sh scripts/*.sh"}

  tests:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubkit/.github/workflows/job-service-tests.yml@18e9594780aeace92770d9bab1daf7ab1c8274d1 # v0.30.1
    with: {"setup": "npm ci", "test": "npm test"}

  sonar:
    name: ci
    needs: [tested, tests]
    if: ${{ !failure() && !cancelled() }}
    uses: Sustenaut/pubkit/.github/workflows/job-sonar.yml@d634bd9ba97c6933561e9e7d1ceff5b975e8f22e # v0.28.0
    permissions:
      actions: read
      contents: read
    with: {"reports": "sonar.python.coverage.reportPaths=*.xml sonar.javascript.lcov.reportPaths=lcov.info", "coverage-run": "${{ needs.tested.outputs.run-id }}"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  # The one check a ruleset requires: it passes only when every job
  # above succeeded or, where the merge queue already passed the
  # commit, was skipped for it. None is skipped for not being asked for.
  passed:
    name: ci / passed
    if: always()
    needs: [tested, checks, tests, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e --arg tested "$TESTED" '.tested.result == "success"
            and all(.[]; .result == "success" or (.result == "skipped" and $tested == "true"))' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}', TESTED: '${{ needs.tested.outputs.tested }}' }
