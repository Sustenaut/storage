# Fail when this repository's calls to outside services and its
# integrations.json disagree: https://github.com/Sustenaut/integrations
name: integrations

on:
  pull_request:
  merge_group:
  push: { branches: [main] }

permissions:
  contents: read

jobs:
  integrations:
    uses: Sustenaut/integrations/.github/workflows/scan.yml@4d5b98dc23d2ecf5b9c32fcbe9d43439a2f41359 # v0.14.1
